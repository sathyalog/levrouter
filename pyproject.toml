[project]
name = "levrouter"
version = "0.1.0"
description = "Per-request model routing for LangChain chat models (Anthropic, OpenAI, Gemini, Groq, DeepSeek, Mistral, xAI, Hugging Face), powered by lev from InterfazeAI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sathya" }]
keywords = ["llm", "routing", "router", "langchain", "anthropic", "openai", "cost", "lev", "levrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.0",
]

[project.optional-dependencies]
# lev is NOT an extra: it is not on PyPI, and PyPI rejects packages whose dependencies point
# at git URLs. Install it separately first (see README, "Prerequisite: lev").
http = ["httpx>=0.27"]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
gemini = ["langchain-google-genai>=3.0"]
groq = ["langchain-groq>=1.0"]
deepseek = ["langchain-deepseek>=1.0"]
mistral = ["langchain-mistralai>=1.0"]
xai = ["langchain-xai>=1.0"]
huggingface = ["langchain-huggingface>=1.0"]
openrouter = ["langchain-openrouter>=0.2"]
providers = ["levrouter[anthropic,openai,gemini,groq,deepseek,mistral,xai,huggingface,openrouter]"]
yaml = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.20"]
all = ["levrouter[http,providers,yaml,otel]"]
dev = ["levrouter[providers]", "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sathyalog/levrouter"
Repository = "https://github.com/sathyalog/levrouter"
Issues = "https://github.com/sathyalog/levrouter/issues"
"lev (decision model)" = "https://github.com/InterfazeAI/lev"

[project.scripts]
levrouter = "levrouter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Auto-discover packages from src-layout
# hatchling automatically finds src/levrouter

[tool.hatch.build.targets.sdist]
include = ["/src/levrouter", "/tests", "/examples", "/docs", "/assets", "/README.md", "/LICENSE", "/NOTICE", "/CONTRIBUTING.md", "/RELEASING.md"]
exclude = ["test_env", ".venv", "dist", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
